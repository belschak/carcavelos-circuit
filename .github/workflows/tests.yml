# Edit Mode + Play Mode tests on GitHub's servers (Role 4).
# Why: since 2026-11-13 Windows Smart App Control blocks Unity's script compiler helper (BeeBuildProgramCommon.dll)
# on David's laptop whenever Unity must re-plan the compile (new scripts, a fresh clone), so local test runs fail with
# "Scripts have compiler errors" although the code is fine. Here the same tests run in GameCI's Linux Unity image.
# When: every pull request into main, every push to main (the README badge shows the result on main), every push to a
# branch called test/... (e.g. test/merge-check-<name>), and by hand (Actions > Tests > Run workflow).
# Pull requests that change only docs or Markdown are skipped (they cannot change a test result). Pushes always run,
# so every commit on main, docs-only ones included, has its own finished Tests result.
# Result: the job summary shows passed / failed per mode; the XML files are in the run's "test-results" artifact.
# Uses the same three repository secrets as web-build.yml (UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD).

name: Tests

on:
  push:
    branches: [main, "test/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  # On main every commit is its own group, so a run is never cancelled or replaced by a later merge: GitHub keeps only
  # ONE waiting run per group and drops the older one, which left commits on main without a result (Sherlock 18.11).
  # On test branches and pull requests one group per branch: a newer push replaces the run of the older one.
  group: tests-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  tests:
    # A pull request from a fork gets no repository secrets, so Unity could not start: such a run is skipped (shown as
    # skipped, not failed) and a team member re-runs the tests on a test/... branch. CI minutes: free for public repos.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' && secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
    steps:
      - name: Check the Unity secrets
        run: |
          if [ "$HAS_LICENSE" != "true" ]; then
            echo "::error::Unity secrets missing (UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD), see web-build.yml. No tests ran."
            exit 1
          fi

      # The Unity image is about 7.5 GB; the runner needs room for it and the project.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Unity's Library folder (imported assets) makes the next run much faster.
      - name: Cache Library
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: Library
          key: Library-Tests-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Tests-

      - name: Run Edit Mode and Play Mode tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # Read-only token for GitHub API lookups made by the action itself. Without it a lookup is anonymous and
          # shares the runner IP's limit of 60 calls per hour with other repos (run 44298834875 failed with 403).
          # It does not create a check run (githubToken below stays empty), so no checks: write is needed.
          GITHUB_TOKEN: ${{ github.token }}
        with:
          unityVersion: auto
          # The game-ci CLI the action downloads, pinned instead of "latest": no "which is the latest release?" API call
          # (the 403 above) and the same tool on every run. v0.1.76 = the version every green run on 18 Nov 2026 used.
          cliVersion: v0.1.76
          # The Web image (same as web-build.yml's build), because Role4WebBuild.cs uses UnityEditor.WebGL and the
          # default image has no Web module, so the editor scripts would not compile. Pinned by digest: the tag could
          # be pushed again with other contents; the digest cannot (it is the image's SHA-256).
          customImage: unityci/editor:ubuntu-6000.3.28f1-webgl-3@sha256:78854b2ee7b5111bac4efe0262fa9e74e31b01d3a9736baab84ee551e3158209
          testMode: all
          artifactsPath: test-results
          githubToken: "" # no check run: that needs checks: write; the job summary below shows the counts instead

      # One line per mode on the run page: total, passed, failed (read from the NUnit XML files).
      - name: Summary
        if: always()
        run: |
          for f in test-results/*.xml; do
            [ -f "$f" ] || continue
            line=$(grep -o '<test-run [^>]*>' "$f" | head -1)
            total=$(echo "$line" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
            passed=$(echo "$line" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]*')
            failed=$(echo "$line" | grep -o 'failed="[0-9]*"' | grep -o '[0-9]*')
            echo "$(basename "$f"): $passed / $total passed, $failed failed" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: test-results
          path: test-results
          if-no-files-found: warn
          retention-days: 14
