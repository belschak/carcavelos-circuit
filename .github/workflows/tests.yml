# Edit Mode + Play Mode tests on GitHub's servers (Role 4).
# Why: since 2026-11-13 Windows Smart App Control blocks Unity's script compiler helper (BeeBuildProgramCommon.dll)
# on David's laptop whenever Unity must re-plan the compile (new scripts, a fresh clone), so local test runs fail with
# "Scripts have compiler errors" although the code is fine. Here the same tests run in GameCI's Linux Unity image.
# When: every push to a branch called test/... (e.g. test/merge-check-<name>), and by hand (Actions > Tests > Run workflow).
# Result: the job summary shows passed / failed per mode; the XML files are in the run's "test-results" artifact.
# Uses the same three repository secrets as web-build.yml (UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD).

name: Tests

on:
  push:
    branches: ["test/**"]
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true # a newer push to the same test branch replaces the old run

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_LICENSE: ${{ secrets.UNITY_LICENSE != '' && secrets.UNITY_EMAIL != '' && secrets.UNITY_PASSWORD != '' }}
    steps:
      - name: Check the Unity secrets
        run: |
          if [ "$HAS_LICENSE" != "true" ]; then
            echo "::error::Unity secrets missing (UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD), see web-build.yml. No tests ran."
            exit 1
          fi

      # The Unity image is about 7.5 GB; the runner needs room for it and the project.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Unity's Library folder (imported assets) makes the next run much faster.
      - name: Cache Library
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: Library
          key: Library-Tests-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-Tests-

      - name: Run Edit Mode and Play Mode tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4.4.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          testMode: all
          artifactsPath: test-results

      # One line per mode on the run page: total, passed, failed (read from the NUnit XML files).
      - name: Summary
        if: always()
        run: |
          for f in test-results/*.xml; do
            [ -f "$f" ] || continue
            line=$(grep -o '<test-run [^>]*>' "$f" | head -1)
            total=$(echo "$line" | grep -o 'total="[0-9]*"' | grep -o '[0-9]*')
            passed=$(echo "$line" | grep -o 'passed="[0-9]*"' | grep -o '[0-9]*')
            failed=$(echo "$line" | grep -o 'failed="[0-9]*"' | grep -o '[0-9]*')
            echo "$(basename "$f"): $passed / $total passed, $failed failed" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: test-results
          path: test-results
          if-no-files-found: warn
          retention-days: 14
