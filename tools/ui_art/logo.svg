<!-- Carcavelos Circuit logo (menu redesign, Role 4). Fonts: Shrikhand + Lilita One (SIL OFL 1.1, Google Fonts).
     The five <g> layers become UI/Art/Logo/logo-*.png and TemplateData/logo-*.png: tools/ui_art/export_logo.py -->
<svg class="logo" viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carcavelos Circuit">
  <style>
    .lg-word { font-family: "Shrikhand"; font-size: 150px; letter-spacing: 1px; }
    .lg-badge-text { font-family: "Lilita One"; font-size: 36px; fill: #FFF6E3; letter-spacing: 4px; }
    .lg-ribbon-text { font-family: "Lilita One"; font-size: 46px; fill: #FFF6E3; letter-spacing: 14px; paint-order: stroke; stroke: #0E2238; stroke-width: 8px; stroke-linejoin: round; }
  </style>
  <defs>
    <linearGradient id="lg-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE98A"/>
      <stop offset="0.55" stop-color="#FFB13B"/>
      <stop offset="1" stop-color="#FF6A3D"/>
    </linearGradient>
    <linearGradient id="lg-word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBEF"/>
      <stop offset="0.58" stop-color="#FFF1CF"/>
      <stop offset="0.6" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <linearGradient id="lg-wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FE0E6"/>
      <stop offset="1" stop-color="#1689B8"/>
    </linearGradient>
    <linearGradient id="lg-ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F7EEA"/>
      <stop offset="1" stop-color="#1B4FB8"/>
    </linearGradient>
    <mask id="m-sunstripes">
      <rect x="0" y="0" width="1000" height="560" fill="#fff"/>
      <rect x="0" y="232" width="1000" height="7" fill="#000"/>
      <rect x="0" y="256" width="1000" height="10" fill="#000"/>
      <rect x="0" y="282" width="1000" height="13" fill="#000"/>
      <rect x="0" y="311" width="1000" height="16" fill="#000"/>
    </mask>
    <path id="p-arc" d="M 90 330 Q 500 205 910 330"/>
    <pattern id="pt-check" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#FFF6E3"/>
      <rect width="7" height="7" fill="#0E2238"/>
      <rect x="7" y="7" width="7" height="7" fill="#0E2238"/>
    </pattern>
  </defs>

  <!-- Sun with retro cut stripes -->
  <g class="lg-sun-g">
    <circle cx="500" cy="236" r="178" fill="#FF8A3D" opacity="0.22"/>
    <circle cx="500" cy="236" r="150" fill="url(#lg-sun)" mask="url(#m-sunstripes)" stroke="#0E2238" stroke-width="0"/>
  </g>

  <!-- Wave curl, from the left, under the word -->
  <g class="lg-wave-g">
    <g transform="translate(500 392) scale(1.12 1.5) translate(-500 -392)">
      <path d="M 110 392 Q 125.0 383.6 140.0 383.6 Q 155.0 375.9 170.0 379.3 Q 185.0 370.5 200.0 375.9 Q 215.0 367.4 230.0 373.1 Q 245.0 364.8 260.0 370.6 Q 275.0 362.6 290.0 368.6 Q 305.0 360.6 320.0 366.8 Q 335.0 359.0 350.0 365.3 Q 365.0 357.7 380.0 364.1 Q 395.0 356.6 410.0 363.2 Q 425.0 355.8 440.0 362.5 Q 455.0 355.3 470.0 362.1 Q 485.0 355.0 500.0 362.0 Q 515.0 355.0 530.0 362.1 Q 545.0 355.3 560.0 362.5 Q 575.0 355.8 590.0 363.2 Q 605.0 356.6 620.0 364.1 Q 635.0 357.7 650.0 365.3 Q 665.0 359.0 680.0 366.8 Q 695.0 360.6 710.0 368.6 Q 725.0 362.6 740.0 370.6 Q 755.0 364.8 770.0 373.1 Q 785.0 367.4 800.0 375.9 Q 815.0 370.5 830.0 379.3 Q 845.0 375.9 860.0 383.6 Q 875.0 383.6 890.0 392.0 Q 500 412 110 392 Z" fill="#0E2238" transform="translate(0 6)"/>
      <path d="M 110 392 Q 125.0 383.6 140.0 383.6 Q 155.0 375.9 170.0 379.3 Q 185.0 370.5 200.0 375.9 Q 215.0 367.4 230.0 373.1 Q 245.0 364.8 260.0 370.6 Q 275.0 362.6 290.0 368.6 Q 305.0 360.6 320.0 366.8 Q 335.0 359.0 350.0 365.3 Q 365.0 357.7 380.0 364.1 Q 395.0 356.6 410.0 363.2 Q 425.0 355.8 440.0 362.5 Q 455.0 355.3 470.0 362.1 Q 485.0 355.0 500.0 362.0 Q 515.0 355.0 530.0 362.1 Q 545.0 355.3 560.0 362.5 Q 575.0 355.8 590.0 363.2 Q 605.0 356.6 620.0 364.1 Q 635.0 357.7 650.0 365.3 Q 665.0 359.0 680.0 366.8 Q 695.0 360.6 710.0 368.6 Q 725.0 362.6 740.0 370.6 Q 755.0 364.8 770.0 373.1 Q 785.0 367.4 800.0 375.9 Q 815.0 370.5 830.0 379.3 Q 845.0 375.9 860.0 383.6 Q 875.0 383.6 890.0 392.0 Q 500 412 110 392 Z" fill="url(#lg-wave)" stroke="#0E2238" stroke-width="6" stroke-linejoin="round"/>
      <path d="M 150 384 Q 500 352 850 384" fill="none" stroke="#E9FFFD" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 14" opacity="0.95"/>
    </g>
    <g fill="#E9FFFD" stroke="#0E2238" stroke-width="3"><circle cx="58" cy="372" r="9"/><circle cx="34" cy="352" r="6"/><circle cx="944" cy="372" r="9"/><circle cx="968" cy="352" r="6"/></g>
  </g>

  <!-- NOVA KART badge -->
  <g class="lg-badge-g" transform="translate(500 64) rotate(-4)">
    <rect x="-168" y="-30" width="336" height="64" rx="32" fill="#0E2238" transform="translate(0 7)"/>
    <rect x="-168" y="-30" width="336" height="64" rx="32" fill="#E6463C" stroke="#0E2238" stroke-width="7"/>
    <text x="0" y="13" text-anchor="middle" class="lg-badge-text">NOVA KART</text>
    <path d="M -146 0 l 11 -11 l 11 11 l -11 11 z" fill="#FFC93C" stroke="#0E2238" stroke-width="3"/>
    <path d="M 146 0 l -11 -11 l -11 11 l 11 11 z" fill="#FFC93C" stroke="#0E2238" stroke-width="3"/>
  </g>

  <!-- Wordmark: extrude, outline, face -->
  <g class="lg-word-g">
    <text class="lg-word lg-word--extrude" fill="#0E2238" stroke="#0E2238" stroke-width="30" stroke-linejoin="round" transform="translate(0 18)"><textPath href="#p-arc" startOffset="50%" text-anchor="middle">Carcavelos</textPath></text>
    <text class="lg-word" fill="#C2410C" stroke="#0E2238" stroke-width="30" stroke-linejoin="round" transform="translate(0 9)"><textPath href="#p-arc" startOffset="50%" text-anchor="middle">Carcavelos</textPath></text>
    <text class="lg-word" fill="url(#lg-word)" stroke="#0E2238" stroke-width="14" stroke-linejoin="round" paint-order="stroke"><textPath href="#p-arc" startOffset="50%" text-anchor="middle">Carcavelos</textPath></text>
  </g>

  <!-- CIRCUIT ribbon -->
  <g class="lg-ribbon-g" transform="translate(500 470)">
    <path d="M -300 -26 L -240 -26 L -240 44 L -300 44 L -276 9 Z" fill="#163F94" stroke="#0E2238" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 300 -26 L 240 -26 L 240 44 L 300 44 L 276 9 Z" fill="#163F94" stroke="#0E2238" stroke-width="8" stroke-linejoin="round"/>
    <path d="M -250 -40 Q 0 -58 250 -40 L 250 30 Q 0 12 -250 30 Z" fill="#0E2238" transform="translate(0 8)"/>
    <path d="M -250 -40 Q 0 -58 250 -40 L 250 30 Q 0 12 -250 30 Z" fill="url(#lg-ribbon)" stroke="#0E2238" stroke-width="8" stroke-linejoin="round"/>
    <path d="M -236 -30 Q 0 -47 236 -30" fill="none" stroke="#8DB6FF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <rect x="-232" y="-30" width="28" height="50" fill="url(#pt-check)" opacity="0.95"/>
    <rect x="204" y="-30" width="28" height="50" fill="url(#pt-check)" opacity="0.95"/>
    <text x="0" y="12" text-anchor="middle" class="lg-ribbon-text">CIRCUIT</text>
  </g>
</svg>
